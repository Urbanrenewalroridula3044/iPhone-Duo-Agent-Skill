<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">iPhone Duo Agent Skills</title>
  <desc id="desc">Audit, plan and adapt SwiftUI and UIKit apps for iPhone Duo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="480" fill="url(#bg)"/>

  <!-- Device: open foldable with a vertical bar and a hinge -->
  <g transform="translate(820 70)">
    <rect x="0" y="0" width="170" height="340" rx="34" fill="url(#panel)" stroke="#e2e8f0" stroke-width="6"/>
    <rect x="186" y="0" width="170" height="340" rx="34" fill="url(#panel)" stroke="#e2e8f0" stroke-width="6"/>
    <path d="M178 -18v376" stroke="#7ee7c7" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 14"/>
    <!-- content columns -->
    <rect x="28" y="48" width="114" height="18" rx="9" fill="#e2e8f0" fill-opacity="0.8"/>
    <rect x="28" y="84" width="96" height="12" rx="6" fill="#e2e8f0" fill-opacity="0.45"/>
    <rect x="28" y="108" width="106" height="12" rx="6" fill="#e2e8f0" fill-opacity="0.45"/>
    <rect x="28" y="132" width="80" height="12" rx="6" fill="#e2e8f0" fill-opacity="0.45"/>
    <rect x="214" y="48" width="96" height="96" rx="16" fill="#e2e8f0" fill-opacity="0.25"/>
    <rect x="214" y="164" width="96" height="12" rx="6" fill="#e2e8f0" fill-opacity="0.45"/>
    <!-- vertical bar -->
    <rect x="322" y="46" width="18" height="150" rx="9" fill="#7ee7c7" fill-opacity="0.2"/>
    <circle cx="331" cy="70" r="5" fill="#7ee7c7"/>
    <circle cx="331" cy="104" r="5" fill="#7ee7c7"/>
    <circle cx="331" cy="138" r="5" fill="#7ee7c7"/>
    <circle cx="331" cy="172" r="5" fill="#7ee7c7"/>
    <!-- check -->
    <path d="m48 250 22 22 44-52" fill="none" stroke="#7ee7c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="150" fill="#7ee7c7" font-size="26" font-weight="600" letter-spacing="4">AGENT SKILLS</text>
    <text x="80" y="222" fill="#ffffff" font-size="72" font-weight="700">iPhone Duo</text>
    <text x="80" y="282" fill="#cbd5e1" font-size="30">Audit, plan and adapt SwiftUI &amp; UIKit apps</text>
    <text x="80" y="322" fill="#cbd5e1" font-size="30">for Apple's foldable — grounded in Apple's sessions.</text>
    <g font-size="22" font-weight="600" fill="#e2e8f0">
      <rect x="80" y="362" width="136" height="44" rx="22" fill="#ffffff" fill-opacity="0.1"/>
      <text x="148" y="391" text-anchor="middle">5 skills</text>
      <rect x="230" y="362" width="170" height="44" rx="22" fill="#ffffff" fill-opacity="0.1"/>
      <text x="315" y="391" text-anchor="middle">SDK-checked</text>
      <rect x="414" y="362" width="196" height="44" rx="22" fill="#ffffff" fill-opacity="0.1"/>
      <text x="512" y="391" text-anchor="middle">Approval-gated</text>
    </g>
  </g>
</svg>
