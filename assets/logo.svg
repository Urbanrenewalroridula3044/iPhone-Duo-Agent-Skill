<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">iPhone Duo Agent Skills</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Open foldable: two panels meeting at a hinge -->
  <rect x="22" y="28" width="40" height="72" rx="9" fill="none" stroke="#fff" stroke-width="6"/>
  <rect x="66" y="28" width="40" height="72" rx="9" fill="none" stroke="#fff" stroke-width="6"/>
  <path d="M64 22v84" stroke="#7ee7c7" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8"/>
  <!-- Vertical bar on the trailing panel -->
  <path d="M94 44v6M94 60v6M94 76v6" stroke="#7ee7c7" stroke-width="6" stroke-linecap="round"/>
  <!-- Checkmark on the leading panel -->
  <path d="m32 66 7 7 13-16" fill="none" stroke="#7ee7c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
